# Read the JTAG debug register (ER1, IR 0x32) off an r2 board through an
# FT4232H on J4. See JTAG_DEBUG in src/top.v. The register is 512 bits, or
# 768 in a sweep build; this shifts 832 so either fits.
adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
ftdi channel 0
ftdi layout_init 0x0008 0x000b
adapter speed 1000
transport select jtag
jtag newtap ecp5 tap -irlen 8 -expected-id 0x21111043
init
irscan ecp5.tap 0x32
echo [drscan ecp5.tap 32 0 32 0 32 0 32 0 32 0 32 0 32 0 32 0 32 0 32 0 32 0 32 0 32 0 32 0 32 0 32 0 32 0 32 0 32 0 32 0 32 0 32 0 32 0 32 0 32 0 32 0]
shutdown
